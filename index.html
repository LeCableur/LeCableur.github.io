<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM du Câbleur</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QCM Câbleur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root { --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2c313c; --text:#eef1f5; --muted:#9aa3b2;
          --acc:#22d3ee; --acc2:#facc15; --ok:#22c55e; --okbg:#0f2e1c; --ko:#ef4444; --kobg:#3a1414; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size:17px; line-height:1.4; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width: 680px; margin: 0 auto; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  header img { width:44px; height:44px; border-radius:12px; }
  h1 { font-size:22px; margin:0; } .sub { color:var(--muted); font-size:14px; }
  h2 { font-size:18px; margin:22px 0 10px; }
  .seg { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { flex:1 1 140px; min-height:52px; border-radius:14px; border:2px solid var(--line); background:var(--card);
    color:var(--text); font-size:16px; font-weight:600; padding:10px 12px; cursor:pointer; }
  .chip.on { border-color:var(--acc); background:#0c2a31; color:var(--acc); }
  .themes .chip { flex:1 1 130px; min-height:48px; font-weight:500; font-size:15px; }
  .btn { display:block; width:100%; min-height:58px; border-radius:16px; border:0; font-size:18px; font-weight:700;
    padding:14px 16px; margin-top:12px; cursor:pointer; background:var(--card2); color:var(--text); }
  .btn.primary { background:var(--acc); color:#04232a; }
  .btn.ghost { background:transparent; border:2px solid var(--line); color:var(--muted); font-weight:600; font-size:16px; }
  .ans { display:block; width:100%; text-align:left; min-height:58px; border-radius:16px; border:2px solid var(--line);
    background:var(--card); color:var(--text); font-size:17px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  .ans.good { border-color:var(--ok); background:var(--okbg); }
  .ans.bad { border-color:var(--ko); background:var(--kobg); }
  .ans.dim { color:var(--muted); }
  .meta { color:var(--muted); font-size:14px; margin-bottom:8px; }
  .q { font-size:21px; font-weight:700; margin:4px 0 16px; }
  .bar { height:8px; background:var(--card2); border-radius:8px; overflow:hidden; margin:8px 0 16px; }
  .bar > i { display:block; height:100%; background:var(--acc); }
  .fb { border-radius:16px; padding:14px 16px; margin-top:6px; }
  .fb.good { background:var(--okbg); border:2px solid var(--ok); } .fb.bad { background:var(--kobg); border:2px solid var(--ko); }
  .fb b { display:block; margin-bottom:6px; font-size:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:15px; }
  .big { font-size:44px; font-weight:800; color:var(--acc); text-align:center; margin:12px 0 4px; }
  .center { text-align:center; } .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main id="app"></main>
<script src="questions.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
